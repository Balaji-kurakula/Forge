name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the checkout.
permissions:
  contents: read

# A new push to the same ref cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: pnpm` shells out to `pnpm store path`,
      # so pnpm has to exist first. action-setup reads the version from the
      # "packageManager" field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint + format
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Demo (smoke)
        run: pnpm demo
